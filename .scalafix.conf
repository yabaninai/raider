// Static analysis gate (nightly Phase 1.2). Syntactic rules only — Scala 3
// supported. ProcedureSyntax is Scala-2-only and cannot be enabled here.
// DisableSyntax bans nulls; var/throw/asInstanceOf are excluded on purpose:
// the pinned REPL driver session, the unreachable-invariant throw and the
// transport casts are documented intentional designs (see DottyReplEngine,
// Composition, provider backends).
rules = [
  DisableSyntax
  LeakingImplicitClassVal
]

DisableSyntax.noNulls = true
